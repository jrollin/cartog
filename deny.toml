[advisories]
# Vulnerabilities always error (cargo-deny default). Report unmaintained and yanked crates.
unmaintained = "workspace"
yanked = "warn"
# Ignored advisories (keep in sync with .cargo/audit.toml).
# 2026-07-06: quick-xml DoS advisories, transitive-only via self_update (0.37)
# and rust-s3/aws-creds (0.38). Fix is quick-xml >=0.41, but both dependents
# pin <0.41 so no upgrade or [patch] applies. Exposure is narrow: XML parsed is
# GitHub release metadata (self_update) and S3 responses (rust-s3), not
# attacker-controlled input. Remove once self_update/rust-s3 pull quick-xml >=0.41.
ignore = [
  "RUSTSEC-2026-0194", # quick-xml: quadratic run time on duplicate attribute names
  "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation (memory DoS)
]

[licenses]
# Permissive licenses only. Any license not listed here is denied.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate to keep the dep tree clean.
multiple-versions = "warn"
# Warn on wildcard versions. Workspace path deps trigger false positives on the
# publishable cartog binary (cargo publish substitutes versions at publish time).
# External wildcards like `rand = "*"` will still show up as warnings in CI.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
