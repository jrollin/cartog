[advisories]
# Vulnerabilities always error (cargo-deny default). Report unmaintained and yanked crates.
unmaintained = "workspace"
yanked = "warn"
# Ignored advisories (keep in sync with .cargo/audit.toml).
ignore = []

[licenses]
# Permissive licenses only. Any license not listed here is denied.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Deny multiple versions of the same crate to keep the dep tree clean.
multiple-versions = "warn"
# Warn on wildcard versions. Workspace path deps trigger false positives on the
# publishable cartog binary (cargo publish substitutes versions at publish time).
# External wildcards like `rand = "*"` will still show up as warnings in CI.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# crates.io only, plus the tree-sitter-ruby [patch] in Cargo.toml (unreleased scanner fix).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tree-sitter/tree-sitter-ruby"]
