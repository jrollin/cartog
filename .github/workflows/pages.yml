name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to latest tag)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            target="${{ inputs.ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            target="${{ github.ref }}"
          else
            # Latest release by version, not by commit reachability — avoids
            # picking up non-release tags (e.g. safety/*) or an older ancestor.
            target=$(git tag -l 'v*' | sort -V | tail -1)
          fi
          [ -n "$target" ] || { echo "no deploy ref resolved"; exit 1; }
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Deploying site from $target"

      - name: Checkout deploy ref
        run: git checkout "${{ steps.ref.outputs.target }}" -- site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Astro site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
