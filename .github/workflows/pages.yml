name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to latest tag)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            target="${{ inputs.ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            target="${{ github.ref }}"
          else
            # Latest release by version, not by commit reachability — avoids
            # picking up non-release tags (e.g. safety/*) or an older ancestor.
            target=$(git tag -l 'v*' | sort -V | tail -1)
          fi
          [ -n "$target" ] || { echo "no deploy ref resolved"; exit 1; }
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Deploying site from $target"

      - name: Checkout deploy ref
        # Whole tree, not just `site/`: the machine-readable endpoints read
        # `README.md` and `docs/` at build time, so a partial checkout would
        # publish the tag's site around the default branch's docs.
        run: git checkout --force "${{ steps.ref.outputs.target }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build Astro site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
