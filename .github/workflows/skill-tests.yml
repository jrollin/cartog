name: Skill Tests

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "agents/**"
      - ".claude-plugin/**"
      - "Cargo.toml"
      - "editors/vscode/package.json"
      - "scripts/check-versions.sh"
      - ".github/workflows/skill-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "agents/**"
      - ".claude-plugin/**"
      - "Cargo.toml"
      - "editors/vscode/package.json"
      - "scripts/check-versions.sh"
      - ".github/workflows/skill-tests.yml"

# These jobs run on `pull_request` and execute shell scripts from the branch
# under test, so the token they carry should be able to do nothing but read.
# Applied at workflow level: every job here is a test runner with the same needs.
permissions:
  contents: read

jobs:
  ensure-indexed:
    name: ensure_indexed.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash skills/cartog/tests/test_ensure_indexed.sh

  drift-notice:
    name: drift_notice.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash skills/cartog/tests/test_drift_notice.sh

  update-on-exit:
    name: update_on_exit.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash skills/cartog/tests/test_update_on_exit.sh

  install-script:
    name: install.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash skills/cartog/tests/test_install.sh

  versions:
    name: Version anchors in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash scripts/check-versions.sh

  plugin-validate:
    name: Claude plugin manifest valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: validator rules change between CLI releases; bump deliberately.
      - run: npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate .
