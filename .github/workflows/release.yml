name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      # fetch-depth: 0 so build.rs `git describe` sees tags → release binary
      # shows the clean tag in its version line, not `unknown`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARTOG_RELEASE_BUILD: "1"
        run: cargo build --release --target ${{ matrix.target }}

      # Smoke-test the built binary (all runners are native — no cross-compilation)
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/cartog
          set -e

          # Binary executes and reports correct version
          VERSION=$($BIN --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "cartog"

          # All expected subcommands are present
          HELP=$($BIN --help)
          for cmd in index outline search refs callees impact hierarchy deps stats doctor config map changes watch serve rag self; do
            echo "$HELP" | grep -q "$cmd" || { echo "FAIL: missing subcommand '$cmd'"; exit 1; }
          done

          # RAG subcommands exist (proves provider-local is compiled in)
          RAG_HELP=$($BIN rag --help)
          for cmd in setup index search; do
            echo "$RAG_HELP" | grep -q "$cmd" || { echo "FAIL: missing rag subcommand '$cmd'"; exit 1; }
          done

          # self subcommands (update / version / rollback) — proves
          # CARTOG_RELEASE_BUILD baked the right install_source.
          SELF_HELP=$($BIN self --help)
          for cmd in update version rollback; do
            echo "$SELF_HELP" | grep -q "$cmd" || { echo "FAIL: missing self subcommand '$cmd'"; exit 1; }
          done
          $BIN self version | grep -q "release-tarball" \
            || { echo "FAIL: install_source should be release-tarball"; $BIN self version; exit 1; }

          echo "Smoke test passed"

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/cartog.exe
          set -e

          VERSION=$($BIN --version)
          echo "$VERSION"
          echo "$VERSION" | grep -q "cartog"

          HELP=$($BIN --help)
          for cmd in index outline search refs callees impact hierarchy deps stats doctor config map changes watch serve rag self; do
            echo "$HELP" | grep -q "$cmd" || { echo "FAIL: missing subcommand '$cmd'"; exit 1; }
          done

          RAG_HELP=$($BIN rag --help)
          for cmd in setup index search; do
            echo "$RAG_HELP" | grep -q "$cmd" || { echo "FAIL: missing rag subcommand '$cmd'"; exit 1; }
          done

          SELF_HELP=$($BIN self --help)
          for cmd in update version rollback; do
            echo "$SELF_HELP" | grep -q "$cmd" || { echo "FAIL: missing self subcommand '$cmd'"; exit 1; }
          done
          $BIN self version | grep -q "release-tarball" \
            || { echo "FAIL: install_source should be release-tarball"; $BIN self version; exit 1; }

          echo "Smoke test passed"

      # Generate man page from the built binary so it always matches shipped
      # subcommands. All matrix entries run natively (see smoke-test comment
      # above), so this must succeed on every unix runner.
      - name: Generate manpage (unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          BIN=target/${{ matrix.target }}/release/cartog
          $BIN manpage > target/${{ matrix.target }}/release/cartog.1
          test -s target/${{ matrix.target }}/release/cartog.1

      # Package unix — hard-require both the binary and the manpage.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cartog-${{ matrix.target }}.tar.gz cartog cartog.1
          cd ../../..

      # Package windows
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../cartog-${{ matrix.target }}.zip cartog.exe
          cd ../../..

      - uses: actions/upload-artifact@v7
        with:
          name: cartog-${{ matrix.target }}
          path: cartog-${{ matrix.target }}.*

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Bound the release notes by an explicit commit range instead of
      # --latest. Historical tags are orphaned off main (a past rebase), so
      # --latest walks back to the last *reachable* tag and dumps all prior
      # history into the notes. The previous "bump version" commit on main is
      # reachable, so <prev-bump>..<tag> gives exactly this release's changes.
      # Mirrors the same logic in scripts/release.sh.
      - name: Compute changelog range
        id: range
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The bump commit for THIS release is the newest match; the previous
          # release's bump is the one before it. Take the 2nd match.
          PREV_BUMP=$(git log "$TAG" --grep='^chore: bump version to' --format='%H' -n2 | tail -n1)
          if [ -n "$PREV_BUMP" ] && [ "$PREV_BUMP" != "$(git rev-list -n1 "$TAG")" ]; then
            echo "args=--tag $TAG --strip header ${PREV_BUMP}..${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--tag $TAG --strip header" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.args }}
        env:
          OUTPUT: CHANGELOG.md

  release:
    name: Create Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Generate SHA256SUMS over every shipped archive. Format matches
      # `sha256sum -c` (one entry per line, "<hash>  <filename>") so users
      # and `cartog self update` can verify downloads in bulk.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # nullglob: an absent matrix target (e.g. dropped Windows) expands
          # to nothing instead of a literal pattern that would fail sha256sum.
          shopt -s nullglob
          files=( cartog-*.tar.gz cartog-*.zip )
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release archives to hash" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.changelog.outputs.release_body }}
          files: artifacts/*

  # NOTE: CARTOG_RELEASE_BUILD is intentionally NOT set in this job. Binaries
  # produced by `cargo install cartog` from crates.io must be detected as
  # `cargo` at runtime (via the path heuristic in commands/self_cmd.rs).
  # Setting it here would brand them as `release-tarball` and let
  # `cartog self update` overwrite cargo-managed binaries.
  publish:
    name: Publish to crates.io
    # Gated on `release` (not `build`) so the GitHub Release and its tarballs
    # exist before crates.io advertises the version — otherwise a user who
    # upgrades in that window resolves a tag with no downloadable assets.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish all crates in dependency order
        env:
          # Do not add CARTOG_RELEASE_BUILD here — see job-level NOTE above.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crates=(
            cartog-core
            cartog-languages
            cartog-db
            cartog-lsp
            cartog-rag
            cartog-indexer
            cartog-process-lock
            cartog-registry
            cartog-watch
            cartog-mcp
            cartog
          )
          for crate in "${crates[@]}"; do
            echo "Publishing $crate..."
            cargo publish -p "$crate" --no-verify
            if [ "$crate" != "cartog" ]; then
              echo "Waiting for crates.io index to update..."
              sleep 60
            fi
          done

  # Publish the VS Code extension to the Visual Studio Marketplace (vsce) and
  # Open VSX (ovsx, for Cursor / Windsurf / VSCodium). Its version is kept in
  # lockstep with the workspace version by scripts/release.sh, so the tag and
  # the published extension version always match.
  #
  # The extension bundles no binary, but its in-editor "Install cartog" action
  # pins CARTOG_VERSION to the extension's own version, so install.sh asserts
  # `releases/download/v<version>/` instead of discovering it via
  # `releases/latest`. Gate on `release` so that URL exists before the
  # Marketplace serves the version — otherwise Install 404s for anyone who
  # upgrades in the gap.
  publish-vscode:
    name: Publish VS Code extension
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify extension version matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "FAIL: package.json version ($PKG) != tag ($TAG)" >&2
            echo "scripts/release.sh should have bumped it — re-run the release." >&2
            exit 1
          fi
          echo "extension version $PKG matches tag"

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --no-dependencies -o cartog.vsix

      # Each registry publishes independently: continue-on-error keeps one
      # registry's failure (a missing secret, an outage, or an already-published
      # version on a same-tag re-run) from skipping the other. The gate step
      # below fails the job only if BOTH failed, so a genuine total failure
      # still surfaces while a single-registry hiccup does not.
      #
      # Marketplace auth is a PAT (VSCE_PAT) for now. Azure DevOps is retiring
      # global PATs on 2026-12-01; migrate to Entra `--azure-credential` before
      # then (see docs/how-to/publish-vscode-extension.md).
      - name: Publish to Visual Studio Marketplace
        id: vsce
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath cartog.vsix

      - name: Publish to Open VSX
        id: ovsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish cartog.vsix

      - name: Require at least one registry to have published
        if: steps.vsce.outcome != 'success' && steps.ovsx.outcome != 'success'
        run: |
          echo "FAIL: both Marketplace and Open VSX publishes failed" >&2
          echo "vsce: ${{ steps.vsce.outcome }}, ovsx: ${{ steps.ovsx.outcome }}" >&2
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: cartog-vscode-extension
          path: editors/vscode/cartog.vsix
