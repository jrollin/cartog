name: Publish VS Code extension

# Recovery path: publish an already-tagged version to the Visual Studio
# Marketplace after the release run's Marketplace publish failed.
# Open VSX is not touched.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.35.0)"
        required: true
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to the Marketplace
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify extension version matches tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "FAIL: package.json version ($PKG) != tag ($TAG)" >&2
            exit 1
          fi
          echo "extension version $PKG matches tag"

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --no-dependencies -o cartog.vsix

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath cartog.vsix --azure-credential
