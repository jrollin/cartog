[package]
name = "cartog-mcp"
description = "MCP server for cartog code graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
cartog-core = { workspace = true }
cartog-db = { workspace = true }
cartog-indexer = { workspace = true }
cartog-rag = { workspace = true }
cartog-watch = { workspace = true }
cartog-process-lock = { workspace = true }
cartog-registry = { workspace = true }
cartog-lsp = { workspace = true, optional = true }
anyhow = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
lsp = ["dep:cartog-lsp", "cartog-indexer/lsp"]

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
# Pull cartog-rag's deterministic mock providers into tests so the MCP server
# can be constructed without loading the real ONNX embedding model.
cartog-rag = { workspace = true, features = ["test-util"] }
# The e2e progress test drives the server with a real in-process rmcp client
# over a duplex transport; `client` is test-only, the binary ships server-only.
rmcp = { workspace = true, features = ["server", "transport-io", "client"] }

[lints]
workspace = true
