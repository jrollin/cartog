[package]
name = "cartog"
description = "Code graph indexer for LLM coding agents. Map your codebase, navigate by graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["code-analysis", "tree-sitter", "graph", "llm", "code-intelligence"]
categories = ["development-tools", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
cartog-core = { workspace = true }
cartog-db = { workspace = true }
cartog-indexer = { workspace = true }
cartog-languages = { workspace = true }
cartog-rag = { workspace = true }
cartog-lsp = { workspace = true, optional = true }
cartog-watch = { workspace = true }
cartog-mcp = { workspace = true }
cartog-process-lock = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
dialoguer = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
self_update = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
rust-s3 = { workspace = true, optional = true }

[features]
default = ["lsp", "remote-s3", "ollama-embedding", "openai-embedding"]
lsp = ["dep:cartog-lsp", "cartog-indexer/lsp", "cartog-mcp/lsp"]
ollama-embedding = ["cartog-rag/provider-ollama"]
openai-embedding = ["cartog-rag/provider-openai"]
remote-s3 = ["dep:rust-s3"]

[dev-dependencies]
criterion = { workspace = true }
serial_test = { workspace = true }
# Used by `tests/remote_integration.rs` to fabricate a non-cartog SQLite file
# for the schema-version refusal negative test. Workspace already pins
# `rusqlite` with `bundled` for the runtime DB, so no new dep is pulled in
# at the workspace level.
rusqlite = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
# Fabricate a valid .tar.gz containing a runnable cartog stub so the
# --apply-pending success path (download → swap → smoke → clear → breadcrumb)
# can be exercised end-to-end. Versions already in the lockfile via self_update.
flate2 = "1"
tar = "0.4"

[[bench]]
name = "queries"
harness = false

# Hybrid-search latency with a deterministic stub embedding provider — never
# loads an ONNX model, so it is safe to run in CI.
[[bench]]
name = "rag_search"
harness = false

# Embedding + reranking latency against the real fastembed/ONNX model. NOT run
# in CI (requires the model on disk); invoke locally via `make bench-onnx`.
[[bench]]
name = "rag_onnx"
harness = false

[lints]
workspace = true
